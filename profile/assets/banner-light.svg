<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Galgame 批评：新的艺术出现之时，需要新的批评">
  <title>Galgame 批评</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF9F4"/>
      <stop offset="50%" stop-color="#FFE9DC"/>
      <stop offset="100%" stop-color="#FFD4BF"/>
    </linearGradient>
    <radialGradient id="halo" cx="10%" cy="5%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C1654B"/>
      <stop offset="100%" stop-color="#C1654B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.24"/>
    </linearGradient>
    <pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#C1654B" fill-opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#halo)"/>
  <rect x="812" width="468" height="360" fill="url(#grain)"/>

  <g transform="translate(872 92) rotate(-7 150 98)" opacity="0.9">
    <rect width="300" height="196" rx="18" fill="#FFFFFF" fill-opacity="0.30" stroke="#C1654B" stroke-opacity="0.16"/>
  </g>
  <g transform="translate(908 68) rotate(4 150 98)">
    <rect width="300" height="196" rx="18" fill="url(#paper)" stroke="#C1654B" stroke-opacity="0.26"/>
    <rect x="30" y="34" width="96" height="6" rx="3" fill="#C1654B" fill-opacity="0.28"/>
    <rect x="30" y="56" width="164" height="5" rx="2.5" fill="#C1654B" fill-opacity="0.16"/>
    <rect x="30" y="74" width="140" height="5" rx="2.5" fill="#C1654B" fill-opacity="0.16"/>
    <rect x="30" y="92" width="152" height="5" rx="2.5" fill="#C1654B" fill-opacity="0.16"/>
    <text x="26" y="196" font-family="Songti SC, Noto Serif SC, Source Han Serif SC, serif" font-size="92" fill="#C1654B" fill-opacity="0.26">「</text>
  </g>

  <g fill="#C1654B" fill-opacity="0.55">
    <path d="M806 74 l4.5 12 12 4.5 -12 4.5 -4.5 12 -4.5 -12 -12 -4.5 12 -4.5z"/>
    <path d="M1188 300 l3.6 9.6 9.6 3.6 -9.6 3.6 -3.6 9.6 -3.6 -9.6 -9.6 -3.6 9.6 -3.6z" opacity="0.75"/>
    <path d="M836 318 l2.8 7.4 7.4 2.8 -7.4 2.8 -2.8 7.4 -2.8 -7.4 -7.4 -2.8 7.4 -2.8z" opacity="0.5"/>
  </g>

  <text x="88" y="110" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="6" fill="#A9604A">ORGANIZATION · EST. 2026</text>
  <text x="86" y="202" font-family="PingFang SC, Microsoft YaHei, Songti SC, Noto Serif SC, serif" font-size="66" font-weight="700" letter-spacing="1" fill="#3A2629">Galgame 批评</text>
  <rect x="88" y="226" width="132" height="3" rx="1.5" fill="url(#rule)"/>
  <text x="88" y="272" font-family="PingFang SC, Microsoft YaHei, Songti SC, Noto Serif SC, serif" font-size="22" letter-spacing="1" fill="#63443F">新的艺术出现之时，需要新的批评。</text>
  <text x="88" y="308" font-family="Helvetica Neue, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" letter-spacing="4" fill="#8E6A61">周报　·　长评　·　开源工具</text>

  <rect x="0.5" y="0.5" width="1279" height="359" fill="none" stroke="#C1654B" stroke-opacity="0.14"/>
</svg>
